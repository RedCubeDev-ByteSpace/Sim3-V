name: V Compiler Status

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup V 0.5.1
        run: |
          curl -fsSL \
            https://github.com/vlang/v/releases/download/0.5.1/v_linux.zip \
            -o v_linux.zip
          unzip -q v_linux.zip
          echo "$PWD/v" >> "$GITHUB_PATH"

      - name: Verify V
        run: |
          v version

      - name: Compile project
        run: (cd src && v install && v .)
